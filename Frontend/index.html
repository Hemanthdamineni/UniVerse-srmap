<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/CircularSrmLogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A3035" />
    <meta name="description" content="Student portal for SRM AP: attendance, marks, fees, timetable, events, LMS resources and career opportunities." />
    <title>UniVerse — SRMAP Edition</title>
    <link rel="dns-prefetch" href="/api" />
    <link rel="preload" href="/fonts/dmsans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script type="module">
      // Dark mode is still in development — production never applies it here,
      // regardless of a stale stored choice from before this was locked down.
      // (Runtime/system-preference resolution is also forced to light in
      // production; see src/lib/core/theme.ts.)
      if (!import.meta.env.PROD) {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {
          /* storage unavailable — default light */
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
