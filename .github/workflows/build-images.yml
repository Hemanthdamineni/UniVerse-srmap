# Builds the deploy-ready backend and ingress Docker images on GitHub's
# runners (plenty of RAM/CPU, unlike the production VM) and pushes them to
# GHCR. A deploy on the VM then becomes `docker compose pull && up -d
# --force-recreate` instead of building on the host — no more OOM'ing on
# `npm run build` or waiting 15+ minutes for the Playwright/venv layer.
#
# First-time setup: after this workflow's first successful run, the two
# packages (universe-erp-backend, universe-erp-ingress) are created as
# private by default. Flip them to public once in
# https://github.com/users/<owner>/packages -> package -> Package settings
# -> Change visibility, so the VM can `docker pull` without `docker login`.

name: Build Images

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - "Scraper/**"
      - "Frontend/**"
      - "infra/docker/ingress.Dockerfile"
      - "infra/nginx/**"
      - "docker-compose.yml"
      - "infra/docker/compose.ingress.yml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/universe-erp-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ingress:
    name: Build ingress image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/universe-erp-ingress" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/ingress.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
