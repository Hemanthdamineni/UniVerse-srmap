name: Build Android APK

# Direct-download distribution (T7.1.3, no Play Console listing): builds a
# signed release APK from the Capacitor shell (docs/24-NATIVE-SHELL.md) and
# publishes it as the `android-latest` GitHub Release asset. The Frontend's
# /download-app page links straight at that release's stable asset URL
# (Frontend/src/config/nativeApp.ts), so this workflow is the only thing that
# needs to run for a new build to go live — no manual upload step.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64    `base64 -w0 your.keystore`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Required repository variable:
#   CAP_SERVER_URL             the deployed origin, e.g. https://erp.srmap.edu.in
# See docs/24-NATIVE-SHELL.md for how to generate the keystore.

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  build-android:
    name: Build + sign release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web assets
        env:
          CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL }}
        run: npm run build

      - name: Add + sync the Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        working-directory: Frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -I "$GITHUB_WORKSPACE/Frontend/android-ci/signing-init.gradle" --no-daemon

      - name: Rename artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk UniVerse.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "UniVerse for Android"
          body: |
            Direct-download build from `${{ github.sha }}`. Not on the Play Store —
            see /download-app on the site for install instructions.
          make_latest: false
          files: Frontend/UniVerse.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-outputs
          path: Frontend/android/app/build/outputs
          if-no-files-found: ignore
