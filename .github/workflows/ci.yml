name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  scraper-quality:
    name: Scraper quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: Scraper/.python-version
          cache: pip
          cache-dependency-path: Scraper/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify imports and run tests
        run: |
          python -c "import aiohttp, pandas, schedule, yaml; from scrapers import devpost_scraper, remote_scraper"
          python -m unittest discover -s tests -v

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        id: backend-audit
        if: always()
        run: |
          npm audit --omit=dev --audit-level=high > backend-audit.txt 2>&1
          echo "report=$(wc -l < backend-audit.txt) lines"

      - name: Upload backend audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-audit
          path: Backend/backend-audit.txt
          if-no-files-found: error

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npx eslint .

      - name: Metadata audit
        run: npm run audit:metadata

      - name: API contract audit
        run: npm run audit:api-contracts

      - name: Audit production dependencies
        id: frontend-audit
        if: always()
        run: |
          npm audit --omit=dev --audit-level=high > frontend-audit.txt 2>&1
          echo "report=$(wc -l < frontend-audit.txt) lines"

      - name: Upload frontend audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-audit
          path: Frontend/frontend-audit.txt
          if-no-files-found: error

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-tests]

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Blocking (T8.2.3): JS gzip total, largest chunk, and the Workbox
      # precache set each have a budget with ~10% headroom. A regression fails
      # the build — bump the budget in the same PR that adds the weight.
      - name: Bundle + precache budget
        run: npm run audit:bundle -- --json bundle-budget.json

      - name: Upload bundle-budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-budget-report
          path: Frontend/bundle-budget.json
          if-no-files-found: ignore

  knip:
    name: Knip dead-export check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies (for knip config + plugins)
        working-directory: Frontend
        run: npm ci

      - name: Install knip
        run: npm install --no-save knip@^6

      # Blocking (T8.3.2): the export/type/file/dependency baseline is 0.
      # A regression makes `knip` exit non-zero and fails the job.
      - name: Run knip
        working-directory: Frontend
        run: |
          set -o pipefail
          npx knip | tee knip-report.txt

      - name: Upload knip report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knip-report
          path: Frontend/knip-report.txt
          if-no-files-found: ignore

  responsive-audit:
    name: Responsive Layout Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static prototype server
        run: |
          VITE_STATIC_PROTOTYPE=true npm run dev -- --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5173/ > /dev/null

      - name: Run responsive audit
        # 390 is the reference mobile viewport; the audit fails the job on any
        # horizontal overflow, clipped text, or accent-wedge leak below 768px.
        run: npm run audit:responsive -- --widths 320,390,768,1440 --out "$RUNNER_TEMP/responsive-audit"

      - name: Run tap-target audit
        # Fails on any interactive element under 44×44 (minus a 2px sub-pixel
        # tolerance) at a 390px phone viewport, bar the documented exceptions.
        run: npm run audit:tap-targets -- --json "$RUNNER_TEMP/tap-targets.json"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-report
          path: ${{ runner.temp }}/responsive-audit/report.json
          if-no-files-found: ignore

  e2e-realstack:
    name: Real-stack e2e
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    # Real-stack e2e coverage is the 13 journey specs landed by
    # PR 7 + the 8 J-specs landed in the follow-up (J1-J8 covering
    # login, ERP, events, LMS, career, helpdesk, admin, forgot).
    # Total 43 specs; all pass against a locally-booted backend
    # (verified by running e2e-stack/start.sh + npx playwright
    # test --config=playwright.config.realstack.ts). CI is a
    # blocking gate.
    continue-on-error: false
    env:
      NODE_VERSION: "22"
    # No `defaults.working-directory` here because we hop between
    # Backend, Frontend, and the repo root for different steps.
    # Each step sets its own working-directory explicitly.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend deps
        working-directory: Backend
        run: NODE_ENV=development npm ci --include=dev

      - name: Start real-stack backend
        working-directory: .
        run: |
          bash Backend/scripts/e2e-stack/start.sh up

      - name: Install frontend deps
        working-directory: Frontend
        run: NODE_ENV=development npm ci --include=dev

      - name: Start frontend dev server (real-stack profile)
        working-directory: Frontend
        env:
          # Vite reads VITE_API_PROXY_TARGET via loadEnv() with
          # default precedence: process.env at startup > .env file.
          # We override the .env file's `VITE_API_PROXY_TARGET=http://localhost:5000`
          # by setting the env at the step level so the dev server
          # proxies to the e2e backend on 5500 (not the 5000 the .env
          # file assumes).
          VITE_API_PROXY_TARGET: http://localhost:5500
        run: |
          unset VITE_API_PROXY_TARGET_FROM_DOTENV
          npm run dev -- --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5173/ > /dev/null

      - name: Install Playwright
        working-directory: Frontend
        run: npx playwright install --with-deps chromium

      - name: Run real-stack Playwright specs
        working-directory: Frontend
        env:
          E2E_BACKEND_URL: "http://127.0.0.1:5500"
          E2E_FRONTEND_URL: "http://127.0.0.1:5173"
        run: npx playwright test --config=playwright.config.realstack.ts

      - name: Tear down backend
        if: always()
        working-directory: .
        run: bash Backend/scripts/e2e-stack/start.sh down

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-realstack-report
          path: |
            ${{ runner.temp }}/playwright-report
            ${{ runner.temp }}/test-results
          if-no-files-found: ignore
