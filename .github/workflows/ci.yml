name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        id: backend-audit
        if: always()
        continue-on-error: true
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > backend-audit.txt 2>&1
          AUDIT_EXIT=$?
          set -e
          echo "audit_exit=$AUDIT_EXIT"
          echo "report=$(wc -l < backend-audit.txt) lines"

      - name: Upload backend audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-audit
          path: backend-audit.txt
          if-no-files-found: ignore

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npx eslint .

      - name: Metadata audit
        run: npm run audit:metadata

      - name: API contract audit
        run: npm run audit:api-contracts

      - name: Audit production dependencies
        id: frontend-audit
        if: always()
        continue-on-error: true
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > frontend-audit.txt 2>&1
          AUDIT_EXIT=$?
          set -e
          echo "audit_exit=$AUDIT_EXIT"
          echo "report=$(wc -l < frontend-audit.txt) lines"

      - name: Upload frontend audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-audit
          path: frontend-audit.txt
          if-no-files-found: ignore

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-tests]

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  knip:
    name: Knip dead-export check
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies (for knip config + plugins)
        working-directory: Frontend
        run: npm ci

      - name: Install knip
        run: npm install --no-save knip@^6

      - name: Run knip
        id: knip
        run: |
          npx knip > knip-report.txt 2>&1 || echo "knip exited non-zero — see report"
          echo "report=$(wc -l < knip-report.txt) lines"

      - name: Upload knip report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knip-report
          path: knip-report.txt
          if-no-files-found: ignore

  responsive-audit:
    name: Responsive Layout Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start static prototype server
        run: |
          VITE_STATIC_PROTOTYPE=true npm run dev -- --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5173/ > /dev/null

      - name: Run responsive audit
        run: npm run audit:responsive -- --widths 320,768,1440 --out "$RUNNER_TEMP/responsive-audit"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-report
          path: ${{ runner.temp }}/responsive-audit/report.json
          if-no-files-found: ignore

  e2e-realstack:
    name: Real-stack e2e
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    # Real-stack e2e coverage is currently the 13 sanity specs
    # landed by PR 7. The job is currently set to continue-on-error:
    # true because a port-alignment issue between the e2e backend
    # launcher (port 5500) and the Vite dev server proxy (still
    # defaulting to 5000) causes a 500 in CI even when local curl
    # against the same backend returns the expected 401. That
    # plumbing fix is tracked as a follow-up; the job surfaces
    # failures (continue-on-error: false would block external
    # prod merges) but does not block the merge queue.
    continue-on-error: true
    env:
      NODE_VERSION: "22"
    # No `defaults.working-directory` here because we hop between
    # Backend, Frontend, and the repo root for different steps.
    # Each step sets its own working-directory explicitly.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend deps
        working-directory: Backend
        run: NODE_ENV=development npm ci --include=dev

      - name: Start real-stack backend
        working-directory: .
        run: |
          bash Backend/scripts/e2e-stack/start.sh up

      - name: Install frontend deps
        working-directory: Frontend
        run: NODE_ENV=development npm ci --include=dev

      - name: Start frontend dev server (real-stack profile)
        working-directory: Frontend
        env:
          # Vite reads VITE_API_PROXY_TARGET via loadEnv() with
          # default precedence: process.env at startup > .env file.
          # We override the .env file's `VITE_API_PROXY_TARGET=http://localhost:5000`
          # by setting the env at the step level so the dev server
          # proxies to the e2e backend on 5500 (not the 5000 the .env
          # file assumes).
          VITE_API_PROXY_TARGET: http://localhost:5500
        run: |
          unset VITE_API_PROXY_TARGET_FROM_DOTENV
          npm run dev -- --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5173/ > /dev/null

      - name: Install Playwright
        working-directory: Frontend
        run: npx playwright install --with-deps chromium

      - name: Run real-stack Playwright specs
        working-directory: Frontend
        env:
          E2E_BACKEND_URL: "http://127.0.0.1:5500"
          E2E_FRONTEND_URL: "http://127.0.0.1:5173"
        run: npx playwright test --config=playwright.config.realstack.ts

      - name: Tear down backend
        if: always()
        working-directory: .
        run: bash Backend/scripts/e2e-stack/start.sh down

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-realstack-report
          path: |
            ${{ runner.temp }}/playwright-report
            ${{ runner.temp }}/test-results
          if-no-files-found: ignore
