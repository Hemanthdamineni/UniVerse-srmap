name: university-erp-app

services:
  app-backend:
    build:
      context: ../../Backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379
      SESSION_STORE_DRIVER: auto
      ERP_CACHE_DRIVER: auto
      FEATURE_ERP_V2_API: "1"
      FEATURE_ERP_CACHED_FIRST: "1"
      FEATURE_AUTH_COOKIE_MODE: "1"
      FEATURE_ERP_DISTRIBUTED_LOCK: "1"
      FEATURE_ERP_ERROR_ENVELOPE: "1"
      FEATURE_FRONTEND_PERF_TELEMETRY: "1"
      LEGACY_SESSION_ID_CUTOFF_DATE: "2026-05-15T00:00:00.000Z"
      SESSION_COOKIE_SECURE: "auto"
      SESSION_COOKIE_SAME_SITE: lax
      CONTENT_DB_PATH: /app/data/content.sqlite
      EXTERNAL_DB_PATH: /app/data/external-pages.sqlite
      EVENTS_DB_PATH: /app/data/events.sqlite
      EVENTS_DATA_DIR: /app/data/events
    ports:
      - "5000:5000"
    volumes:
      - ../../Backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/live"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    networks:
      - erp_app
      - erp_data

networks:
  erp_app:
    name: erp_app
  erp_data:
    external: true
    name: erp_data
