services:
  ingress:
    build:
      # Repo root, not ./infra: the image builds Frontend/ directly and
      # bakes the compiled dist/ in, so `docker compose build` still works
      # for local iteration even though CI publishes this image prebuilt
      # (see .github/workflows/build-images.yml) and the deploy path just
      # `docker compose pull`s it instead of building on the host.
      context: .
      dockerfile: infra/docker/ingress.Dockerfile
    image: ${INGRESS_IMAGE:-ghcr.io/hemanthdamineni/universe-erp-ingress:latest}
    # No host ports are published. The Cloudflare Tunnel override
    # (compose.tunnel.yml) reaches this service over the internal
    # compose network by its service name (`ingress`); nothing here
    # is ever exposed directly on the host's public interface.
    volumes:
      # Compose resolves every relative bind against the first compose file
      # (`docker-compose.yml` at the repository root), not this override.
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      # Certificates are provisioned outside source control. The directory may
      # contain the normal letsencrypt `live/` tree.
      - ./infra/certs:/etc/letsencrypt:ro
    environment:
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:-localhost}
    restart: unless-stopped
