services:
  ingress:
    build:
      context: ./infra
      dockerfile: docker/ingress.Dockerfile
    image: university-erp-ingress:local
    # No host ports are published. The Cloudflare Tunnel override
    # (compose.tunnel.yml) reaches this service over the internal
    # compose network by its service name (`ingress`); nothing here
    # is ever exposed directly on the host's public interface.
    volumes:
      # Compose resolves every relative bind against the first compose file
      # (`docker-compose.yml` at the repository root), not this override.
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./Frontend/dist:/usr/share/nginx/html:ro
      # Certificates are provisioned outside source control. The directory may
      # contain the normal letsencrypt `live/` tree.
      - ./infra/certs:/etc/letsencrypt:ro
    environment:
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:-localhost}
    restart: unless-stopped
