# DEPRECATED — Redis is now defined in the root docker-compose.yml.
# This file is kept for reference only. Use the root compose instead:
#   docker compose up -d
#
# If you need a standalone Redis instance for development:
#   docker compose -f infra/docker/compose.data.yml up -d
#   export REDIS_PASSWORD=your-password

name: university-erp-data

x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 10s

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Redis password is required. Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"   # bind to loopback only — never expose publicly
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]

volumes:
  redis_data:
