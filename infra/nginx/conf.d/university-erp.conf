upstream backend_pool {
  least_conn;
  server backend:5000 max_fails=3 fail_timeout=10s;
  keepalive 64;
}

limit_req_zone $binary_remote_addr zone=api_ip_rate:20m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=api_ip_conn:20m;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
  listen 80;
  server_name _;

  # Security headers on redirect responses too
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Let Encrypt ACME challenge — always served over HTTP
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  # Everything else redirects to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS server ───────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name _;

  # TLS certificate paths — provision with infra/scripts/setup-tls.sh
  # or mount your own cert/key pair at these paths.
  ssl_certificate     /etc/letsencrypt/live/$host/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/$host/privkey.pem;

  # Modern TLS config (Mozilla Intermediate 2024)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # OCSP stapling
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout 5s;

  # HSTS — 1 year, include subdomains, preload
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://erp.srmap.edu.in; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  # Denial-of-service: limit request body
  client_max_body_size 10M;

  location = /nginx_status {
    stub_status;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    deny all;
  }

  location /api/ {
    limit_req zone=api_ip_rate burst=60 nodelay;
    limit_conn api_ip_conn 80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    proxy_pass http://backend_pool;
  }

  location /files/ {
    alias /srv/university-erp-data/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
    }
  }
}
