upstream backend_pool {
  least_conn;
  server app-backend:5000 max_fails=3 fail_timeout=10s;
  keepalive 64;
}

limit_req_zone $binary_remote_addr zone=api_ip_rate:20m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=api_ip_conn:20m;

server {
  listen 80;
  server_name _;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /nginx_status {
    stub_status;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    deny all;
  }

  location /api/ {
    limit_req zone=api_ip_rate burst=60 nodelay;
    limit_conn api_ip_conn 80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    proxy_pass http://backend_pool;
  }

  location /files/ {
    alias /srv/university-erp-data/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
    }
  }
}
