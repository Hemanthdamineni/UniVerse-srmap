name: university-erp

x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

x-deploy-resources: &deploy-resources
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 128M

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: universe-srmap-backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      - SESSION_STORE_DRIVER=auto
      - ERP_CACHE_DRIVER=auto
      - FEATURE_ERP_V2_API=1
      - FEATURE_ERP_CACHED_FIRST=1
      - FEATURE_AUTH_COOKIE_MODE=1
      - CONTENT_DB_PATH=/app/data/content.sqlite
      - EXTERNAL_DB_PATH=/app/data/external-pages.sqlite
      - EVENTS_DB_PATH=/app/data/events.sqlite
      - EVENTS_DATA_DIR=/app/data/events
      # Scraper disabled in container: Scraper/venv is not shipped in the image.
      # The supervisor reflects this via /api/career/health ("unavailable" state).
      # Set CAREER_SCRAPER_ENABLED=1 and ship Scraper/venv to enable.
      - CAREER_SCRAPER_ENABLED=${CAREER_SCRAPER_ENABLED:-0}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - ADMIN_CONTENT_PASSWORD=${ADMIN_CONTENT_PASSWORD:-}
    volumes:
      - ./Backend/data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
    <<: *deploy-resources

  redis:
    image: redis:7-alpine
    container_name: universe-srmap-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
    <<: *deploy-resources

volumes:
  redis_data:
