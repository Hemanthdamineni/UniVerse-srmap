name: university-erp

x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

x-deploy-resources: &deploy-resources
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 128M

services:
  backend:
    build:
      # Repo root, not ./Backend: the image also ships the sibling
      # Scraper/ directory (see Backend/Dockerfile). CI builds and pushes
      # this image on every push to main (.github/workflows/build-images.yml)
      # so a deploy is normally just `docker compose pull` — this `build:`
      # stays only so `docker compose build` still works for local iteration.
      context: .
      dockerfile: Backend/Dockerfile
    image: ${BACKEND_IMAGE:-ghcr.io/hemanthdamineni/universe-erp-backend:latest}
    container_name: universe-srmap-backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      - SESSION_STORE_DRIVER=auto
      - ERP_CACHE_DRIVER=auto
      - FEATURE_ERP_V2_API=1
      - FEATURE_ERP_CACHED_FIRST=1
      - FEATURE_AUTH_COOKIE_MODE=1
      - CONTENT_DB_PATH=/Backend/data/content.sqlite
      - EXTERNAL_DB_PATH=/Backend/data/external-pages.sqlite
      - EVENTS_DB_PATH=/Backend/data/events.sqlite
      - EVENTS_DATA_DIR=/Backend/data/events
      # The image ships its own Scraper/venv (see Backend/Dockerfile), but the
      # scraper still defaults to off — set CAREER_SCRAPER_ENABLED=1 in .env
      # to enable it. The supervisor reflects the disabled state via
      # /api/career/health ("disabled").
      - CAREER_SCRAPER_ENABLED=${CAREER_SCRAPER_ENABLED:-0}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - ADMIN_CONTENT_PASSWORD=${ADMIN_CONTENT_PASSWORD:-}
    volumes:
      - ./Backend/data:/Backend/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/ready"]
    <<: *deploy-resources

  redis:
    image: redis:7-alpine
    container_name: universe-srmap-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
    <<: *deploy-resources

volumes:
  redis_data:
