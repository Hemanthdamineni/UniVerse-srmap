<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <link type="text/css" href="/srmapstudentcorner/resources/css/studentstyle.css" rel="stylesheet"/>
        <script language="javascript" src="/srmapstudentcorner/resources/js/jquery.js" type="text/javascript"></script>    
        <link type="text/css" href="/srmapstudentcorner/resources/css/jquery-ui.css" rel="stylesheet"/>        
        <script type="text/javascript" src="/srmapstudentcorner/resources/js/jquery-ui.js"></script>
        <script type="text/javascript" src="/srmapstudentcorner/resources/js/stripes.js" ></script>
        <style>
            thead{
                position: sticky;
                top: 0;
            }
        </style>
        <script>
            var frmTitle = "Student Exam Application Details";
            function superAlert(argTitle, argMsg, argObject) {
                try {
                    var dialogHtml = "<p><span class='ui-icon ui-icon-circle-close' style='float:left; margin:0 7px 50px 0;'></span>" +
                            argMsg + "</p>";
                    $("#divAlert").html(dialogHtml);
                    $("#divAlert").attr("title", argTitle);
                    $("#divAlert").dialog({
                        modal: true,
                        buttons: {
                            "Ok": function () {
                                $(this).dialog("close");
                                $("#" + argObject).focus();
                            }
                        }
                    });
                    return;
                } catch (e) {
                }
            }
            function funPrintApplication() {
                if ($("#cmbExamMonth").val() == "0,0,0") {
                    superAlert(frmTitle, "Select Exam Month And Year", "");
                    return false;
                }
                var tem = $("#cmbExamMonth").val().split(',');
                var studentid = tem[2];
                var exammonth = tem[0];
                var examyear = tem[1];
                var imagefoundstatus = $("#hdnImageFound").val();
                var url = "/srmapstudentcorner/students/report/PrintStudentExamApplication.jsp?ExamMonth=" + exammonth + "&ExamYear=" + examyear + "&sid=" + studentid + "&fnd=0";
                window.open(url, "Exam Application", "width=950,height=650,scrollbars=yes,left=40,top=150");
            }
        </script>
    </head>

    <div><h2 style="color: #000066">Exam Application Details</h2></div>
    <br>
    <div><table class="table table-striped table-bordered" style="width: 70%">
            <td style="vertical-align: middle;width: 20%">Exam Month And Year</td>
            <td style="width: 40%;vertical-align: middle">
                <select name="cmbExamMonth" id="cmbExamMonth" style="height: 35px;width: 280px">
                    <option value="0,0,0"> [Select Exam Month And Year] </option>
                    
                    
                        
                        <option value="12,2023,14688">DECEMBER 2023</option>
                    
                        
                        <option value="5,2024,14688">MAY 2024</option>
                    
                        
                        <option value="12,2024,14688">DECEMBER 2024</option>
                    
                        
                        <option value="5,2025,14688">MAY 2025</option>
                    
                        
                        <option value="12,2025,14688">DECEMBER 2025</option>
                    
                    </option>
                </select>
            </td>
            <tr>
                <td colspan="2" style="text-align: center">
                    <button class="btn btn-warning" onclick="funPrintApplication()">Print</button>
                </td>
            </tr>
        </table></div>
    <br>
    <div id="divAlert" style="width: 100%"></div>
</html>
