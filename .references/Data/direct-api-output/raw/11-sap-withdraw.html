<html>
    <head>
         <style>
            .alert-danger { color: red;font-weight: bolder;font-size: x-large;}
            .alert-success { color: green;font-weight: bolder;font-size: x-large;font-family: monospace}
            .divmsg { color: green;font-weight: bolder;font-size: x-large;font-family: monospace}
        </style>
        <script>
            var url = "students/registrations/sapregistrationresource.jsp";
            var frmtitle = "SEMESTER ABROAD PROGRAM";
            $(function () {
                $(".divmsg").hide();
                $(".btWithdraw").on("click", funWithdraw);
            });
            function funWithdraw() {
                if ($.trim($("#studentremarks").val()) === "") {
                    superAlert(frmtitle, "Fill Remarks", "", "#divAlert");
                    return false;
                }
                var confirm = window.confirm("Wish to Withdraw?");
                if (!confirm)
                    return;
                var ajaxparameter = [];
                ajaxparameter.push({name: 'ids', value: 6});
                ajaxparameter.push({name: 'studentremarks', value: $("#studentremarks").val()});
                ajaxparameter.push({name: 'hdnsapregistrationid', value: ''});
                $.post(url, ajaxparameter, function (data) {
                    if (data.result === 1) {
                        $(".clstblwithdraw").hide();
                        $(".btWithdraw").hide();
                        $(".divmsg").show();
                        $(".divmsg").html(data.resultmsg);
                    } else {
                        superAlert(frmtitle, data.resultmsg, "", "#divAlert");
                    }
                }, "json");
            }
        </script>
    </head>
    <body>
        <br> <br>
        <div>&nbsp;</div>
        <div class="container-fluid">
            <div class="panel panel-info">
            <div class="panel-body" id="divMain">
                <div class="alert alert-info" style="color: black;font-weight: bolder;"><h4> SAP WITHDRAW</h4> </div>
                
                
                
                    <div class="alert alert-danger">
                        You are not registered with SAP.
                    </div>
                
                
                
                
                
                
            </div>
        </div>
    </body>
</html>
