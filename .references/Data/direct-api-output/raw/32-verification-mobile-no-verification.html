


<!DOCTYPE html>




<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>Mobile Number  Verification</title>
        <script src="/srmapstudentcorner/resources/js/jquery.validationEngine-en.js" type="text/javascript"></script>
        <script src="/srmapstudentcorner/resources/js/jquery.validationEngine.js" type="text/javascript"></script>
        <link type="text/css" href="/srmapstudentcorner/resources/css/validationEngine.jquery.css" rel="stylesheet"/>
        <style>
            input,select{
                height: 30px;
            }
        </style>
        <script>
            $(function () {
                $("#frmMobileNoVerify").validationEngine('attach');
                $("button").button().click(function (event) {
                    event.preventDefault();
                });
                $("button").on('click', function (e) {
                    e.preventDefault();
                });
                $(".btnSave").on("click", funSave);
            });

            function funSave() {
                $("#referencecode").val($('#optmobilenumber').val() * 222);
                funMobileVerificationOTP();
            }

            function funMobileVerificationOTP() {
                var ajaxparameter = [];
                ajaxparameter.push({name: 'ids', value: 1});
                ajaxparameter.push({name: 'optmobilenumber', value: $("#optmobilenumber").val()});
                ajaxparameter.push({name: 'referencecode', value:$("#referencecode").val()});
                $.post("students/transaction/mobilenumberverificationotp.jsp", ajaxparameter, function (data) {
                    $("#divContent").html(data);
                }, "html").fail(function (jqXHR, textStatus, errorThrown) {
                    alert(jqXHR.responseText);
                });
            }

            function funReturnhome() {
                $("#returnhome").submit();
            }

        </script>
    </head>
    <body>
        <br> <br>
        <div>&nbsp;</div> 
        <div class="container-fluid">
            <div class="panel panel-info">
                <div class="panel-heading panel-info"><h2> Mobile Number  Verification</h2></div>
                <div class="panel-body">
                    <div class="row">
                        <div class="col-sm-6">Please note that all communication sent on mobile number will be triggered only on registered mobile number. </div>
                    </div>
                    <form id="frmMobileNoVerify_222" method="POST" autocomplete="off">
                        <div class="row">
                            <div class="col-sm-6">&nbsp;</div>
                        </div>
                        <div class="row">
                            <div class="col-sm-3">Edit / verify your Mobile Number :</div>
                            <div class="col-sm-3"><input type="text"  id="optmobilenumber" value="9492891632" maxlength="10"></div>
                        </div>
                        <div class="row">
                            <div class="col-sm-6">&nbsp;</div>
                        </div>
                        <div class="row">
                            <div class="col-sm-6" style="text-align: center">
                                <button style="font-size:1.1em;" class="btn btn-large btn-info btnSave" onclick="funSendOTP()"><b>Send OTP</b></button>
                                <button style="font-size:1.1em;" class="btn btn-large btn-warning" onclick="funReturnhome()"><b>Return to Login </b></button>
                                <input type="hidden"  id="referencecode" name="referencecode">
                            </div>
                        </div>
                    </form>
                    <form name="returnhome" id="returnhome" action="/srmapstudentcorner" method="post"></form>
                </div>
            </div>
        </div>
    </body>
</html>
