


<!DOCTYPE html>



<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    </head>
    <style>
        .select-cell {
            background: #fbec88; /* Or some other color */
        }
    </style>
    <script>
        $(function () {
            $('.clsSubject').on("click", function () {
                $(this).parent('tr').find('td').removeClass('select-cell');
                $(this).addClass('select-cell');
                callQuestions($(this));
            });
        });

        function callQuestions(argObject) {
            $('#divQuestions').css("display", "block");
            var subjectid = argObject.prop("id");
            $.post("students/transaction/subjectwisefeedbackresources.jsp", {ids: 1, filter: argObject.prop("id"), controller: $("#mcontroller").val()}, function (data) {
                $("#divQuestions").html(data);
                var dheaders = argObject.html();
                dheaders = dheaders.replace("<br>", "<div style='float:right'> Faculy Name : ");
                $("#divSubHeader").html(" " + dheaders + "</div>");
                $("#hdnSubjectId").val(subjectid);
                $("button").button()
                        .click(function (event) {
                            event.preventDefault();
                            funSubmit();
                        });
            }, "html");
        }

        function validation() {
            var blnResult = false;
            var descriptiveQuestions = 0;
            var totalQuestions = 0;
            var radioQuestions = 0;
            var $questions = $(".clsquestions");
            descriptiveQuestions = $questions.find("textarea").length;
            totalQuestions = $questions.length;
            radioQuestions = totalQuestions - descriptiveQuestions;
            //alert($questions.length + "  " + $questions.find("input:radio:checked").length)
            if ($questions.find("input:radio:checked").length === radioQuestions) {
                //alert("checked");
                blnResult = true;
            } else {
                alert("Not Checked");
            }
            
            $('#frmFeedbackEntry *').filter('.clsanswertextarea').each(function () {
                answerdesc = $(this).val();
                answerdesc = $.trim(answerdesc);
                if (answerdesc.length < 10){
                    alert(" All Comments and Suggestions are Mandatory");
                    blnResult = false;
                    return blnResult;
                }
            });
            
            return blnResult;
        }

        function funSubmit() {
            if (!validation())
                return;

            var objQuestion;
            var objAllQuestions = new Array();
            $('#frmFeedbackEntry *').filter(':input').each(function () {
                objQuestion = new Object();
                if ($(this).prop('type') == "radio") {
                    if ($(this).is(":checked")) {
                        objQuestion.questionid = $(this).closest("tr").attr("itemid");
                        objQuestion.answerid = $(this).val();
                        objQuestion.answerdesc = $(this).attr("uvalue");
                        objQuestion.quesid = $(this).attr("quesid");
                        objQuestion.partid = $(this).attr("partid");
                        objQuestion.answervalue = $(this).attr("answervalue");
                        objQuestion.pointvalue = $(this).attr("pointvalue");
                        objAllQuestions.push(objQuestion);
                    }
                    $(this).prop("disabled", true);
                }
            });
            var objQuestionText;
            var objAllQuestionsText = new Array();
            $('#frmFeedbackEntry *').filter('.clsanswertextarea').each(function () {
                objQuestionText = new Object();
                objQuestionText.questionid = $(this).closest("tr").attr("itemid");
                objQuestionText.answerdesc = $(this).val();
                objQuestionText.quesid = $(this).attr("quesid");
                objQuestionText.partid = $(this).attr("partid");
                objAllQuestionsText.push(objQuestionText);
            });

            var ajaxparameter = $('#frmFeedbackEntry').serializeArray();
            ajaxparameter.push({name: 'ids', value: 2});
            ajaxparameter.push({name: 'filter', value: ''});
            ajaxparameter.push({name: 'answers', value: JSON.stringify(objAllQuestions)});
            ajaxparameter.push({name: 'descriptiveanswer', value: JSON.stringify(objAllQuestionsText)});
            ajaxparameter.push({name: 'remarks', value: $("#txtRemarks").val()});
            ajaxparameter.push({name: 'feedbacktype', value: $("#feedbacktype").val()});
            $.post("students/transaction/subjectwisefeedbackresources.jsp", ajaxparameter, function (data) {
                if (data.resultstatus == 1) {
                    alert(data.result);
                    $("#divQuestions").html("");
                    if (data.feedbacktype == 1)
                    {
                        funLoadDetails(29);
                    } else {
                        funLoadDetails(9);
                    }
                }
                //document.location.reload(true);
            }, "json");
        }

    </script>
    <body>
        
        
        
        
        <br>
        <div><h2 style="color: #000066">SUBJECT WISE FEEDBACK - END SEMESTER</h2></div>

        

        
            <!-- End Semester Feedback ids : 9 -->
            
                
                 
            
            <!-- End Semester Feedback ids : 9 -->
            
            <input type="hidden" id="feedbacktype" name="feedbacktype" value="2"/>
            <input type="hidden" id="mcontroller" value="0"/>
            

            
            
                <div><h3 style="color: #E85445">FEEDBACK NOT ENABLED BY ADMINISTRATOR</h2></div>
            
        
        
    </body>
</html>
