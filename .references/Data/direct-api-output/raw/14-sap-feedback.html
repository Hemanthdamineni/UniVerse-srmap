<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>Personal Details</title>
        <style>
            .alert-danger { color: red;font-weight: bolder;font-size: medium;}
        </style>
        <script>
            var url = "students/registrations/sapregistrationresource.jsp";
            $(function () {
                $("#hdnsapregistrationid").val();
                $("button").button().click(function (event) {
                    event.preventDefault();
                });

                $("button").on('click', function (e) {
                    e.preventDefault();
                });
                $(".divAttachFile").on("click", function () {
                    funGetImageAttachmentId($(this).attr("accesskey"));
                });
            });

            function funGetImageAttachmentId(arg) {
                var AjaxParameter = [];
                AjaxParameter.push({name: "ids", value: "7"});
                $.post(url, AjaxParameter, function (data) {
                    if (data.resultstatus === 1) {
                        funUpload(arg, data.ImageAttachmentId);
                    }
                }, "json");
            }

            function funAttachDetails() {
                var fileid = "";
                var strdetails = "";
                $(".clsinnnerattach").each(function () {
                    fileid = $(this).attr("accesskey");
                    if (strdetails === "") {
                        strdetails = fileid;
                    } else {
                        strdetails = strdetails + "," + fileid;
                    }
                });
                $("#hdnImageAttachmentId").val(strdetails);
            }

            function funUpload(argAttachmentTypeId, argId) {
                var currentTime = new Date();
                var str_currentdate = currentTime.getFullYear() + "_" + parseInt(currentTime.getMonth() + 1) + "_" + currentTime.getDate();
                str_currentdate += "_" + currentTime.getHours() + "_" + currentTime.getMinutes() + "_" + currentTime.getMilliseconds();
                var fileName = "temp_" + argId + str_currentdate;
                var url = "/srmapstudentcorner/students/registrations/sapregistrationattachment.jsp?filename=" + fileName + "&fileid=" + argId
                        + "&typeid=" + argAttachmentTypeId + "&RegistrationId=" + $("#hdnsapregistrationid").val();
                d = $('#divDialog').html('<iframe id="ifrm" frameborder="0" style="height:100%;width:100%"></iframe>');
                $("#divDialog").attr("title", "DOCUMENT ATTACHMENTS");
                d.dialog({
                    width: 700,
                    height: 500,
                    modal: true,
                    closeOnEscape: true
                }).prev(".ui-dialog-titlebar");
                $("#divDialog>#ifrm").attr("src", url);
            }
            function funRemoveAttachment(arg) {
                var fileType = $(arg).closest("tr").prop("id");
                if (!confirm('Wish to remove attachment?'))
                    return;
                var url = "students/registrations/sapregistrationattachment.jsp?Filename=" + $(arg).closest("tr").attr("itemid")
                        + "&pageAction=51&Fileid=" + $(arg).closest("tr").attr("itemprop")
                        + "&typeid=" + fileType + "&RegistrationId=" + $("#hdnsapregistrationid").val();
                $.ajax({
                    url: url,
                    cache: false,
                    type: "post",
                    success: function (html) {
                        superAlert(frmtitle, "File removed", "", "#divAlert");
                    }
                });
//                $("#hdn_" + fileType).val("");
                $("#divAttachFile_" + fileType).show();
                $(arg).closest("table").remove();
            }
            function funRemoveFile(filename, fileid, filetypeid, arg) {
                if (!confirm('Wish to remove attachment?'))
                    return;
                var url = "students/registrations/sapattachmentinner.jsp?Filename=" + filename + "&pageAction=51&fileid=" + fileid
                        + "&typeid=" + filetypeid + "&RegistrationId=" + $("#hdnsapregistrationid").val();
                $.ajax({
                    url: url,
                    cache: false,
                    type: "post",
                    success: function (html) {
                        superAlert(frmtitle, "File removed", "", "#divAlert");
                    }
                });
                $(arg).closest("table td").remove();
            }

            function funViewFile(filename) {
                var applnparameter = [];
                applnparameter.push({name: "pageAction", value: "52"});
                applnparameter.push({name: "filter", value: filename});
                applnparameter.push({name: "ActualName", value: filename});
                $("#divtemp").html("<table width='100%'><tr><td align=center><img src='/srmapstudentcorner/resources/Image/wait.gif'></td></tr></table>");
                $("#divtemp").show();
                $.post('students/registrations/sapattachmentinner.jsp', applnparameter, function (data) {
                    $("#divtemp").hide();
                    var filename = $.trim(data).replace("%20", "");
                    var win2 = window.open('/srmapstudentcorner/resources/temp/' + filename, "Attachments", "location = no,toolbar=no,location=no,directories=no,status=no,menubar=no,width=900,height=600,scrollbars=yes,status=0");
                    win2.focus();
                }, "html");
            }

        </script>
